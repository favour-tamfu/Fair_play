# Cloud override (deploy/PLAN.md): adds Caddy for HTTPS in front of the api and stops publishing port 8000.
# Use:  docker compose -f docker-compose.yml -f deploy/docker-compose.cloud.yml up -d --build
# Needs SITE_ADDRESS in .env, e.g. SITE_ADDRESS=129-151-10-20.sslip.io   (untested: written before the VM exists)
services:
  api:
    ports: !reset []                      # reach the api only through Caddy (HTTPS)

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
