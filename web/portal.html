<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fair Play · Upload a song</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .wrap { max-width: 880px; margin: 0 auto; padding: 16px; }
  form { display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .owner { display: grid; grid-template-columns: 2fr 1.2fr 1fr 1.6fr auto; gap: 6px; align-items: end; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; }
  .ok { color: var(--teal); font-size: 13px; }
  .chip2 { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .s-uploaded { background: var(--chip); color: var(--muted); }
  .s-processing { background: #fff3d6; color: var(--amber); }
  .s-ready { background: #d8f2ee; color: var(--teal); }
  .s-duplicate_suspected { background: #fbe3e0; color: var(--red); }
  .s-failed { background: #fbe3e0; color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  @media (max-width: 600px) { .owner { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header class="top"><div class="brand">Fair Play <span>· upload a song</span></div></header>
<main class="wrap">
  <form id="form">
    <label>Audio file (MP3, WAV, M4A or FLAC, at most 50 MB)
      <input type="file" id="file" accept=".mp3,.wav,.m4a,.flac,audio/*" required>
    </label>
    <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label>Title <input id="title" required maxlength="200"></label>
      <label>Artist name <input id="artist" required maxlength="200"></label>
      <label>ISRC (optional) <input id="isrc" maxlength="20"></label>
      <label>ISWC (optional) <input id="iswc" maxlength="20"></label>
    </div>

    <div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:4px">Owners (shares must add up to 100)</div>
      <div id="owners" style="display:grid;gap:6px"></div>
      <button type="button" id="add-owner">+ add owner</button>
      <span id="share-sum" class="note" style="margin-left:8px"></span>
    </div>

    <label style="grid-template-columns:auto 1fr;align-items:start">
      <input type="checkbox" id="consent" required>
      <span>I own or represent the rights to this recording and agree to its use for royalty monitoring.</span>
    </label>

    <div><button type="submit" class="on" id="submit">Upload</button>
      <span id="progress" class="note"></span></div>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>
  </form>

  <h2 style="font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:24px">Catalogue</h2>
  <table><thead><tr><th>title</th><th>artist</th><th>status</th><th>detail</th></tr></thead><tbody id="cat"></tbody></table>
</main>
<script type="module" src="js/portal.js"></script>
</body>
</html>
