<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fair Play · artist</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px 16px 40px; }
  h1 { font-size: 22px; margin: 6px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .card { background: var(--chip); border-radius: 10px; padding: 12px; }
  .card span { display: block; color: var(--muted); font-size: 12px; }
  .card b { font-size: 20px; }
  .banner { display: none; background: var(--teal); color: #fff; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
  .banner.show { display: block; }
  h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 6px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
  .chart i { flex: 1; background: var(--teal); opacity: .6; border-radius: 3px 3px 0 0; min-height: 2px; }
  .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="sub">Fair Play · artist page</div>
  <h1 id="name">–</h1>
  <div class="sub" id="songs"></div>

  <div class="banner" id="banner"></div>

  <div class="cards">
    <div class="card"><span>counted plays</span><b id="counted">–</b></div>
    <div class="card"><span>amount (FCFA)</span><b id="amount">–</b></div>
  </div>

  <h2>Bars that played your song</h2>
  <div id="venues"></div>

  <h2>Plays by day</h2>
  <div class="chart" id="chart"></div>
  <div class="muted" id="chart-range"></div>

  <h2>Recent plays</h2>
  <div id="recent"></div>
</main>
<script type="module" src="js/artist.js"></script>
</body>
</html>
