<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" role="img" aria-labelledby="t">
  <title id="t">SONACAM — Société Nationale Camerounaise de l'Art Musical</title>
  <!-- Redrawn for the Fair Play SONACAM app: wordmark with the green-red-yellow "O" and the red note, in the app's type -->
  <defs>
    <style>
      .w { font-family: "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; fill: #1d1d1f; }
      .s { font-family: "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #1d1d1f; letter-spacing: .42px; }
      .e { font-family: "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 600; fill: #86868b; letter-spacing: .9px; }
    </style>
  </defs>

  <!-- S -->
  <text class="w" x="0" y="44" font-size="44">S</text>

  <!-- O: rings in the colours of Cameroon (green, red, yellow) -->
  <g transform="translate(46 29)">
    <circle r="15.5" fill="#007a3d"/>
    <circle r="11" fill="#ce1126"/>
    <circle r="6.6" fill="#fcd116"/>
    <path d="M0 -3.4 L1 -1 L3.4 -1 L1.5 0.5 L2.2 3 L0 1.5 L-2.2 3 L-1.5 0.5 L-3.4 -1 L-1 -1 Z" fill="#007a3d"/>
  </g>

  <!-- the red note rising from the O -->
  <g fill="#ce1126">
    <rect x="58.2" y="2" width="2.6" height="20" rx="1.3"/>
    <path d="M60.8 2 C66 4 70 7.5 68.6 13.5 C67.6 9.5 64.5 7.8 60.8 7.6 Z"/>
    <ellipse cx="55.2" cy="21.2" rx="5" ry="3.6" transform="rotate(-24 55.2 21.2)"/>
  </g>

  <!-- NACAM -->
  <text class="w" x="66.5" y="44" font-size="44" letter-spacing="-.8">NACAM</text>

  <!-- full name -->
  <text class="s" x="1" y="58" font-size="7.2">SOCIÉTÉ NATIONALE CAMEROUNAISE DE L'ART MUSICAL</text>
  <text class="e" x="1" y="67.5" font-size="6.2">CAMEROON NATIONAL MUSIC CORPORATION</text>
</svg>
