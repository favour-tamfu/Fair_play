# Fair Play — SONACAM server (Laptop B). Start: docker compose up -d --build   Stop: docker compose down
# One image (server/Dockerfile) for every Python service; each runs a different command.
name: fairplay

x-app: &app
  build:
    context: .
    dockerfile: server/Dockerfile
  image: fairplay-server:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    TZ: Africa/Douala                # log timestamps in Cameroon time (data and API stay UTC, contract)
  volumes:
    - ./server:/app/server            # live code (no rebuild needed for server changes)
    - ./core/fairplay_core:/app/core/fairplay_core:ro
    - ./contract:/app/contract:ro     # meter keys, schemas, fixtures
    - ./web:/app/web:ro               # A's static pages (served by api)
    - ./media:/app/media              # uploaded songs (gitignored)
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:55432:5432"        # host tools/tests only; not reachable from the hotspot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    command: uvicorn server.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"                   # the meter (Laptop A) and the browser connect here
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker_fp:
    <<: *app
    command: python -m server.workers.fingerprint

  worker_match:
    <<: *app
    command: python -m server.workers.matcher

  worker_play:
    <<: *app
    command: python -m server.workers.playlogger

  scheduler:
    <<: *app
    command: python -m server.workers.scheduler

volumes:
  pgdata:
